[tool.poetry]
name = "mega-software-ml"
version = "0.1.0"
description = "Mega Software de ML autónomo, híbrido y de alta privacidad (Zero Trust) ejecutado localmente."
authors = ["Luis Fernández <luisf@example.com>"]
readme = "README.md"
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.1.0"
pyarrow = "^15.0.0"
scikit-learn = "^1.3.0"
pydantic = "^2.6.0"
pyyaml = "^6.0.1"
openai = "^1.12.0"
spacy = "^3.7.0"
sentence-transformers = "^2.5.0"
umap-learn = "^0.5.5"
hdbscan = "^0.8.33"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
